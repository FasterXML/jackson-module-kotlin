name: Re-build on jackson-databind v3 push
on:
  repository_dispatch:
    types: [jackson-databind-pushed-v3]
  # just for testing
  workflow_dispatch:

permissions:
  contents: read

# databind pushes arrive in bursts; only the newest one is worth a full matrix.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: '3.x'
      # A subset of the JDKs covered by 'main.yml'. The Kotlin versions need to
      # align with the ones there.
      java_versions: '["17", "21", "25", "27"]'
      # Exclude 2.5.0-Beta1: Duration reflection fails (https://youtrack.jetbrains.com/issue/KT-89918).
      kotlin_versions: '["2.1.21", "2.2.21", "2.3.21", "2.4.21-RC"]'
