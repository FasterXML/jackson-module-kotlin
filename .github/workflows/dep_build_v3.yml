name: Re-build on jackson-databind v3 push
on:
  repository_dispatch:
    types: [jackson-databind-pushed-v3]
  # just for testing
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: '3.x'
      # A subset of the JDKs covered by 'main.yml'. The Kotlin axis is shared
      # by every caller and lives in 'build.yml'.
      java_versions: '["17", "21", "25", "26"]'
