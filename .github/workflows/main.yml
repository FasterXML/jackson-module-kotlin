name: Build and Deploy Snapshot
on:
  push:
    branches: ['3.*']
    paths-ignore:
    - "README.md"
    - "release-notes/*"
  pull_request:
    paths-ignore:
    - "README.md"
    - "release-notes/*"
  # just for testing
  workflow_dispatch:

permissions:
  contents: read

# One matrix run is a sizable burst of Maven Central traffic, so do not keep
# superseded runs of the same PR alive. Pushes to '3.*' are not cancelled
# because their last job deploys a snapshot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      java_versions: '["17", "21", "25", "26"]'
      kotlin_versions: '["2.1.21", "2.2.21", "2.3.21", "2.4.20-RC3"]'
      deploy_snapshot: ${{ github.event_name != 'pull_request' }}
      release_java_version: '17'
      release_kotlin_version: '2.1.21'
    secrets:
      CENTRAL_DEPLOY_USERNAME: ${{ secrets.CENTRAL_DEPLOY_USERNAME }}
      CENTRAL_DEPLOY_PASSWORD: ${{ secrets.CENTRAL_DEPLOY_PASSWORD }}
